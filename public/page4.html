<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طلب التمويل - الملخص</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-header {
            width: 100%;
            background: linear-gradient(135deg, #581d72, #a1278a);
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .zain-logo {
            font-size: 20px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            width: 92%;
            max-width: 480px;
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(88, 29, 114, 0.12);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #222;
            font-weight: 600;
        }

        .step-info {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin: 10px 0 25px;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 4px;
            flex: 1;
            background: #8c237e;
            border-radius: 2px;
        }

        .input-wrap {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #444;
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d1d1;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fff;
            font-family: inherit;
        }

        select:focus, input:focus {
            border-color: #8c237e;
            outline: none;
        }

        .summary-box {
            background-color: #fcf8ff;
            border-right: 5px solid #8c237e;
            border-left: none;
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
        }

        .summary-box h3 {
            margin: 0 0 15px 0;
            font-size: 17px;
            font-weight: 700;
            color: #333;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #f0e2f5;
            padding-bottom: 8px;
        }

        .summary-label {
            color: #666;
            font-size: 14px;
        }

        .summary-value {
            font-weight: 600;
            font-size: 14px;
            color: #000;
            text-align: left;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .back-btn {
            background: #f1f1f5;
            color: #666;
            border: 1px solid #ddd;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(135deg, #8c237e, #581d72);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 35, 126, 0.25);
            text-transform: uppercase;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:16px;">← رجوع</div>
    <div class="zain-logo">زين كاش</div>
    <div style="font-size: 22px;">☰</div>
</div>

<div class="form-card">
    <h2>طلب التمويل</h2>
    <p class="step-info">الخطوة 3 من 3</p>

    <div class="progress-box">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>الحالة الوظيفية</label>
        <select id="jobStatus">
            <option value="موظف راتب ثابت">موظف براتب ثابت</option>
            <option value="عمل حر">عمل حر</option>
            <option value="طالب">طالب</option>
            <option value="بدون عمل">بدون عمل</option>
            <option value="متقاعد">متقاعد</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>الدخل الشهري (د.ع)</label>
        <input type="text" id="income" placeholder="مثال: 1,250,000">
    </div>

    <div class="summary-box">
        <h3>ملخص الطلب</h3>

        <div class="summary-item">
            <span class="summary-label">مبلغ التمويل:</span>
            <span class="summary-value" id="sumAmount">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">مدة السداد:</span>
            <span class="summary-value" id="sumDuration">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">الغرض:</span>
            <span class="summary-value" id="sumPurpose">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">مُقدم الطلب:</span>
            <span class="summary-value" id="sumName">--</span>
        </div>
    </div>

    <div class="btn-container">
        <button type="button" class="back-btn" onclick="goBack()">السابق</button>
        <button type="button" class="submit-btn" onclick="submitForm()">إرسال الطلب</button>
    </div>
</div>

<div class="footer-text">© 2026 زين كاش العراق. جميع الحقوق محفوظة.</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const amount = localStorage.getItem('amount');
    const duration = localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";

    const numericAmount = amount ? Number(amount.replace(/[^\d]/g, '')) : 0;

    document.getElementById('sumAmount').innerText = numericAmount ? `${numericAmount.toLocaleString('ar-IQ')} د.ع` : "--";
    document.getElementById('sumDuration').innerText = duration || "--";
    document.getElementById('sumPurpose').innerText = purpose || "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
};

function submitForm() {
    const tg = window.Telegram?.WebApp;

    const data = {
        amount: localStorage.getItem('amount'),
        duration: localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: document.getElementById('income').value
    };

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 500);
    } else {
        console.log("Submitted:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page4";
}
</script>

</body>
</html>
