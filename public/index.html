<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاسبة القروض - زين كاش العراق</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(135deg, #581d72, #a1278a);
            padding: 20px 20px 40px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(88, 29, 114, 0.12);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #222;
            margin: 0 0 5px;
            text-align: center;
        }

        .subtext {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-bottom: 25px;
        }

        .slider-section { margin-bottom: 25px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        .purple-text { 
            color: #8c237e; 
            font-weight: bold; 
        }

        input[type=range] {
            width: 100%;
            accent-color: #8c237e;
            margin: 15px 0;
            height: 6px;
            cursor: pointer;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
        }

        .result-container {
            background: #fcf8ff;
            border: 1px solid #f0e2f5;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #581d72;
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0 0;
        }

        .btn-apply {
            background: linear-gradient(135deg, #8c237e, #581d72);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 35, 126, 0.25);
            transition: opacity 0.2s;
        }

        .btn-apply:active {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>زين كاش - ZainCash</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>احصل على تمويل سريع</h2>
    <div class="subtext">موافقة سريعة • نسب ميسرة • فترة سداد مرنة</div>

    <div class="slider-section">
        <div class="slider-header">
            <span>مبلغ التمويل</span>
            <span id="valAmt" class="purple-text">1,000,000 د.ع</span>
        </div>
        <input type="range" id="amt" min="250000" max="10000000" step="250000" value="1000000">
        <div class="slider-footer"><span>250,000 د.ع</span><span>10,000,000 د.ع</span></div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>مدة السداد</span>
            <span id="valDur" class="purple-text">12 شهر</span>
        </div>
        <input type="range" id="dur" min="6" max="60" step="6" value="12">
        <div class="slider-footer"><span>6 أشهر</span><span>60 شهر</span></div>
    </div>

    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666">القسط الشهري التقديري</p>
        <p id="monthly" class="result-value">98,333 د.ع</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">قدّم الآن</button>
</div>

<div class="footer">© 2026 زين كاش العراق. جميع الحقوق محفوظة.</div>

<script>
    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        document.getElementById('valAmt').innerText = `${amount.toLocaleString('ar-IQ')} د.ع`;
        document.getElementById('valDur').innerText = `${duration} شهر`;

        // 18% total dynamic interest rate logic preserved from original file
        const monthly = Math.round((amount * 1.18) / duration);
        document.getElementById('monthly').innerText = `${monthly.toLocaleString('ar-IQ')} د.ع`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        localStorage.setItem('amount', amtEl.value + " IQD");
        localStorage.setItem('loanDuration', durEl.value + " أشهر");

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
